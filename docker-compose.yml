version: "3.9"

services:
  db:
    image: postgres:15
    container_name: jeevan-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jeevan
    

  api:
    build: .
    container_name: user-api
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/jeevan?sslmode=disable
    ports:
      - "3000:3000"
    depends_on:
      - db
